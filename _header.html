<!-- Sidebar title: add cross-listed course numbers -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var title = document.querySelector('.sidebar-title');
    if (!title) return;

    if (!document.querySelector('.sidebar-course-numbers')) {
      var nums = document.createElement('div');
      nums.className = 'sidebar-course-numbers';
      nums.textContent = 'MBA 693R · STRAT 490R';
      title.insertAdjacentElement('afterend', nums);
    }
  });
</script>

<!-- Draft watermark on every page except the resources page -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!/07-resources/.test(window.location.pathname)) {
      document.body.classList.add('draft-page');
    }
  });
</script>
